[tool.poetry]
name = "agent-paper-assistant"
version = "0.1.0"
description = "多 Agent 协作的学术论文辅助生成系统（LangGraph + LangChain + FastAPI + Streamlit）"
authors = ["Paper-Agent Team <dev@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
# 核心编排与 LLM
langgraph = ">=0.2.0,<2.0.0"
langchain = ">=0.3.0,<2.0.0"
langchain-openai = ">=0.2.0,<2.0.0"       # DeepSeek / OpenAI 兼容接口
openai = ">=1.50.0,<3.0.0"
# Web 服务与前端
fastapi = ">=0.115.0,<1.0.0"
uvicorn = { extras = ["standard"], version = ">=0.30.0,<1.0.0" }
streamlit = ">=1.38.0,<2.0.0"
python-multipart = ">=0.0.9,<1.0.0"        # FastAPI 文件上传（multipart 表单）
# 文档处理
python-docx = ">=1.1.2,<2.0.0"
docxtpl = ">=0.17.0,<1.0.0"
pypdf = ">=4.0.0,<7.0.0"                  # PDF 解析（模板大纲提取）
# 数据存储与缓存
redis = ">=5.0.0,<7.0.0"
sqlalchemy = ">=2.0.0,<3.0.0"
# 向量数据库
chromadb = ">=0.5.0,<2.0.0"
langchain-chroma = ">=0.1.4,<2.0.0"
# HTTP 与配置
httpx = ">=0.27.0,<1.0.0"
pydantic = ">=2.8.0,<3.0.0"
pydantic-settings = ">=2.4.0,<3.0.0"
python-dotenv = ">=1.0.1,<2.0.0"

[tool.poetry.group.postgres.dependencies]
asyncpg = ">=0.29.0,<1.0.0"               # PostgreSQL 异步驱动（可选）
aiosqlite = ">=0.20.0,<1.0.0"             # SQLite 异步驱动（开发环境）

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<1.0.0"
ruff = ">=0.6.0,<1.0.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"
